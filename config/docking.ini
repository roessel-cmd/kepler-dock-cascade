# ============================================================
# docking.ini  –  Stufe 2: DOCKING (Uni-Dock, GPU)
#
# Wird vom Docking-Container gelesen. Der Orchestrator bindet
# diese Datei nach /app/pipeline_config.ini:
#   --bind $PWD/config/docking.ini:/app/pipeline_config.ini
#
# Gelesen von: docking_config.DockingConfig.from_ini()
#              orchestrator.py (GPU, CHUNK, PATHS)
#
# Kein [CPU], kein [VINA], kein [RESCORE], kein [CONVERSION] –
# diese Stufe dockt ausschliesslich auf der GPU.
# ============================================================


# ------------------------------------------------------------
# VERZEICHNISSE
# pdbqt_dir  ← kommt aus Stufe 1 (convert.ini)
# results_dir → geht an Stufe 3 (rescore.ini)
# Beide muessen dort identisch eingetragen sein.
# ------------------------------------------------------------
[PATHS]
pdbqt_dir   = ./data/PDBQT   # Liganden-PDBQTs aus Stufe 1
target_dir  = ./TARGET       # Rezeptor-PDBQTs + config.txt
results_dir = ./RESULTS      # Posen (<ligand>_docked.pdbqt) + Chunk-CSVs
log_dir     = ./data/LOG


# ------------------------------------------------------------
# GPU
# ------------------------------------------------------------
[GPU]
num_gpus       = 4   # Anzahl GPUs fuer paralleles Multi-Target-Docking
cuda_device_id = 0   # nur relevant bei num_gpus = 1


# ------------------------------------------------------------
# UNI-DOCK
# Alle Werte hier sind 1:1 Uni-Dock-CLI-Flags.
# ------------------------------------------------------------
[UNIDOCK]
binary = unidock

# search_mode ist die empfohlene Kurzform fuer exhaustiveness + max_step:
#   fast    – guenstigster Betriebspunkt fuer grosse Screens
#   balance – Standard
#   detail  – hoechste Genauigkeit, hoechste Kosten
# Leer lassen, um exhaustiveness und max_step explizit zu setzen –
# nur dann werden die beiden folgenden Werte ueberhaupt ausgewertet.
search_mode    = balance
exhaustiveness = 384
max_step       = 0        # 0 = Flag weglassen

num_modes    = 9
energy_range = 3

scoring = vina            # vina | vinardo | ad4
                          # ad4 erwartet vorberechnete AutoGrid-Maps

# Liganden pro unidock-Prozess. Die Stellschraube fuer die GPU-Auslastung:
# hochdrehen bis der Speicher limitiert.
batch_size = 1000

# MB. 0 = kein Limit. Bei OOM auf ~70000 setzen (H100 80 GB) bzw. rund
# 75 % des VRAM. Die Engine halbiert bei OOM ohnehin automatisch den
# Sub-Batch – dieser Wert ist die Vorbeugung, nicht die Rettung.
max_gpu_memory = 0

timeout     = 7200        # Sekunden pro Sub-Batch, 0 = kein Timeout
refine_step = 0           # 0 = Uni-Dock Default
seed        = 0           # 0 = zufaellig; fester Wert = reproduzierbar


# ------------------------------------------------------------
# CHUNKING
# Dispatch-Einheit des Orchestrators: eine Job-Datei, eine Chunk-CSV.
# Nicht zu verwechseln mit [UNIDOCK] batch_size – ein Chunk von 5000
# laeuft als 5 Sub-Batches à 1000 in EINEM Worker durch.
# Bei sehr ungleich grossen Targets eher 2000, damit am Ende eines
# Targets keine GPU lange auf den Nachzuegler wartet.
# ------------------------------------------------------------
[CHUNK]
chunk_size = 5000
