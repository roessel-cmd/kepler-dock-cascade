# ============================================================
# rescore.ini  –  Stufe 3: RESCORING + REFINEMENT (GPU)
#
# Wird vom Rescoring-Container gelesen. Der Orchestrator bindet
# diese Datei nach /app/pipeline_config.ini:
#   --bind $PWD/config/rescore.ini:/app/pipeline_config.ini
#
# Gelesen von: docking_rescore.RescoringConfig.from_ini()
#              gnina_refinement.RefinementConfig.from_ini()
#              orchestrator.py (RESCORE rescore_num_gpus/-device_id)
#
# Alle Keys unten sind aus den beiden from_ini()-Methoden abgeleitet,
# die Defaults entsprechen exakt den dortigen fallback-Werten.
#
# AKTUELLE STRATEGIE (Stand 21.08.2026)
#   ECR aus zwei dekorrelierten Quellen:
#     1. Vinardo – kommt gratis aus dem PDBQT-Header, wenn in docking.ini
#        [UNIDOCK] scoring = vinardo gesetzt ist. Spalte heisst score_vina.
#     2. Dense-Ensemble CNNaffinity – ein Vorwaertslauf ueber alle Posen.
#   Kein zusaetzlicher gnina --score_only Lauf, genau ein CNN-Netz.
# ============================================================


# ------------------------------------------------------------
# VERZEICHNISSE
# results_dir ← kommt aus Stufe 2 (docking.ini), muss identisch sein.
# Rescoring liest <ligand>_docked.pdbqt und schreibt daneben
# rescoring_poses_<target>.csv und rescoring_ligands_<target>.csv.
# ------------------------------------------------------------
[PATHS]
target_dir  = ./TARGET
results_dir = ./RESULTS
log_dir     = ./data/LOG


# ------------------------------------------------------------
# GPU
# Der Orchestrator liest diese Sektion auch in Stage "rescore".
# Fehlt sie, faellt num_gpus auf 1 zurueck und das Rescoring laeuft
# auf einer einzigen GPU – die Targets werden dann nicht verteilt.
# ------------------------------------------------------------
[GPU]
num_gpus       = 4
cuda_device_id = 0


# ------------------------------------------------------------
# RESCORING
# ------------------------------------------------------------
[RESCORE]
enabled = true

# --- Scoring-Funktionen ---
# Ein Flag entscheidet, ob die Funktion GERECHNET wird UND ob sie ins
# Ranking eingeht. Bis August 2026 galt das nur fuer die empirischen
# Funktionen; die CNN-Netze liefen unabhaengig von ihren Flags immer mit,
# und die Flags steuerten nur die Auswertung. Seit dem Patch in
# docking_rescore.py (primary_cnn_needed / dense_cnn_needed) gilt beides
# einheitlich. Mindestens eine Funktion muss aktiv sein.

# ── Empirisch, Richtung: kleiner = besser ───────────────────────────
# vina liegt fertig im PDBQT-Header und kostet nichts. vinardo und ad4
# brauchen je EINEN zusaetzlichen gnina --score_only Lauf pro Ligand
# (CNN dabei aus, also CPU-bound und billig, aber nicht kostenlos).
#
# ACHTUNG zur Interpretation: vina_enabled liest den Wert, mit dem GEDOCKT
# wurde. Steht in docking.ini [UNIDOCK] scoring = vinardo, enthaelt die
# Spalte score_vina Vinardo-Werte. check_config.py warnt in dem Fall.
# Getestet am 21.08.2026: unidock-Vinardo und gnina-Vinardo sind NICHT
# identisch (mittlerer Versatz +0.90 kcal/mol, Kendall tau 0.89) – die
# Werte stammen aus derselben Familie, sind aber nicht austauschbar.
vina_enabled          = true
vinardo_enabled       = false   # nicht noetig, wenn mit vinardo gedockt wird
ad4_enabled           = false   # braucht vorberechnete AutoGrid-Maps

# ── Lernbasiert, intern invertiert (groesser = besser wird zu kleiner) ──
# Zwei unabhaengige Netze, je EIN Vorwaertslauf ueber alle Posen:
#
#   Primaermodell  = cnn_model    -> score_cnnaffinity, score_cnnscore
#   Zweitmodell    = dense_model  -> score_dense_cnnaffinity, _cnnscore
#
# Ein Netz liefert IMMER beide Ausgaenge; sie kosten zusammen so viel wie
# einer. Was davon ins Ranking eingeht, regeln die Gewichte weiter unten,
# nicht diese Flags.
#
# Beide crossdock-Flags false und dense_enabled true  -> genau EIN Netz.
# Alle drei true                                      -> ZWEI Netze,
#                                                        doppelte GPU-Zeit.
#
# Aktuelle Wahl: nur das Dense-Ensemble. cnnaffinity und cnnscore stammen
# aus EINER Vorwaertsrechnung desselben Netzes und korrelieren stark –
# beide zu aktivieren gewichtet diese eine Sicht faktisch doppelt.
cnnaffinity_enabled   = false   # Primaermodell CNNaffinity (pK)
cnnscore_enabled      = false   # Primaermodell CNNscore (0-1)
dense_enabled         = true    # Zweitmodell, liefert beide Ausgaenge
deltalinf9xgb_enabled = false   # Lin_F9 + XGBoost, eigenes Conda-Env

cnn_model   = crossdock_default2018_ensemble   # nur bei cnn*_enabled = true
dense_model = dense_ensemble

# --- gnina ---
gnina_binary  = /usr/local/bin/gnina   # leer = Autodetect via PATH
gnina_use_gpu = true
# gnina_gpu_id wird zur Laufzeit vom Orchestrator gesetzt (CUDA_VISIBLE_DEVICES)
# und aus der INI bewusst NICHT gelesen.

# --- Parallelisierung ---
n_jobs                     = 1   # joblib-Worker
deltalinf9xgb_n_workers    = 1   # parallele Worker fuer ΔLin_F9XGB-Scoring
deltalinf9xgb_prep_workers = 0   # MOL2-Vorbereitung; 0 = wie n_workers
# Posen pro GPU-Batch. 0 = Auto-Schaetzung aus dem freien VRAM.
# Gemessen am 21.08.2026 auf H100 94GB: Auto waehlte 3950 Posen, das
# ergab CUDA-OOM (13.02 GiB angefordert, 5.32 GiB frei), weil beim
# Dense-Lauf ein zweites Modell im Speicher liegt. 800 laeuft stabil.
# Seit dem Retry in gnina_gpu_worker.py kostet ein zu grosser Wert nur
# Zeit, keine Daten mehr – vorher gingen die Scores still verloren.
rescore_batch_size         = 800

# Mindestanteil der Posen eines Blocks, die einen Score haben muessen,
# damit der Block als Zwischenstand gesichert wird. Darunter bricht das
# Rescoring ab, statt einen lueckenhaften Block zu sichern, den der
# Neustart ueberspringen wuerde.
min_block_coverage         = 0.99

# Blockgroesse fuer wiederaufnahmefaehiges Rescoring. 0 = aus.
# Bei > 0 wird die Ligandenliste in Bloecke geschnitten, jeder Block
# vollstaendig gescort und sofort als Zwischenstand gesichert
# (RESULTS/<target>/.rescore_partial/scores_NNNNN.csv). Ein Neustart
# ueberspringt gesicherte Bloecke. Ohne das verliert ein an der Walltime
# abgebrochener Job die gesamte Arbeit des Targets.
#
# Das Ranking laeuft weiterhin ueber ALLE Posen, erst wenn alle Bloecke
# vorliegen – die ECR-Raenge sind global.
#
# Preis: pro Block wird das gninatorch-Modell neu geladen. Ab etwa 1000
# Liganden je Block faellt das nicht ins Gewicht, bei 100 schon.
# Fuer HPC-Laeufe mit Walltime empfohlen: 2000.
rescore_block_size         = 2000

# --- GPU-Verteilung (vom Orchestrator gelesen) ---
rescore_num_gpus       = 0   # 0 = GPUs aus [GPU] num_gpus der Docking-Stufe
rescore_cuda_device_id = 0

# --- Pose-Clustering vor dem Rescoring ---
cluster_poses       = false
cluster_rmsd_cutoff = 2.0    # Angstrom

# --- ECR (Exponential Consensus Ranking) ---
# Aktuelle Wahl: Vinardo (empirisch, gratis aus der Pose) + Dense-Affinity
# (lernbasiert). Maximal dekorreliert – anders als cnnaffinity+cnnscore,
# die aus EINER Vorwaertsrechnung desselben Netzes stammen.
# sigma = N / sigma_fraction, N = Anzahl Posen
sigma_fraction = 4.0

# Gewichte pro Scoring-Funktion. Alle 0.0 = gleichgewichtet (1/K) ueber
# die AKTIVEN Funktionen. Sonst wird auf Summe 1.0 normiert, ebenfalls nur
# ueber die aktiven – inaktive Gewichte werden ignoriert.
#
# Ein Gewicht von 0.0 bei AKTIVER Funktion ist ausdruecklich erlaubt: der
# Wert wird berechnet und landet in der CSV, geht aber nicht ins Ranking
# ein. Genau so ist w_dense_cnnscore unten gesetzt – er faellt aus dem
# Dense-Vorwaertslauf gratis mit ab und ist fuer die Validierung nuetzlich.
#
# Hinweis: ECR gewinnt seine Staerke aus DEKORRELIERTEN Funktionen. Vina,
# Vinardo und AD4 stammen aus derselben Termfamilie; ebenso gehoeren
# cnnaffinity und cnnscore eines Netzes zusammen. Die aktuelle Wahl –
# Vinardo (empirisch, aus der Pose) plus Dense-Affinity (lernbasiert,
# eigenes Netz) – ist die am staerksten dekorrelierte Kombination, die
# ohne zusaetzliche Rechenzeit zu haben ist.
w_vina              = 0.5   # enthaelt Vinardo, wenn so gedockt wurde
w_vinardo           = 0.0
w_ad4               = 0.0
w_cnnaffinity       = 0.0
w_cnnscore          = 0.0
w_deltalinf9xgb     = 0.0
w_dense_cnnaffinity = 0.5
w_dense_cnnscore    = 0.0   # aktiv, aber bewusst ohne Gewicht


# ------------------------------------------------------------
# REFINEMENT
# Laeuft nach dem Rescoring auf den besten Liganden.
# ------------------------------------------------------------
[REFINEMENT]
enabled = false

top_fraction    = 0.15          # Anteil der Top-Liganden, der verfeinert wird
refinement_mode = local_only    # local_only | minimize | autobox
autobox_extend  = 4.0           # Angstrom, nur bei refinement_mode = autobox

cnn_model = crossdock_default2018_ensemble

use_gpu      = true
gnina_binary = /usr/local/bin/gnina

exhaustiveness = 0   # 0 = nur lokale Optimierung, keine neue Suche
num_modes      = 1
