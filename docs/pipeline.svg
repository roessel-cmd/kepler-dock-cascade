<text x="152" y="367" font-size="19" font-weight="600" fill="#0F172A" letter-spacing="0.4">DOCKING</text>
<text x="152" y="392" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#64748B">unidock-gpu.sif</text>
