<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" role="img" aria-label="Three-stage virtual screening pipeline: preparation, docking, rescoring">
<title>dock-cascade pipeline (light)</title>
